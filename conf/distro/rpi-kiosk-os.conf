DISTRO = "rpi-kiosk-os"
DISTRO_NAME = "rpi-kiosk-os"
DISTRO_VERSION = "0.1"

# Use a base policy (recommended)
require conf/distro/poky.conf

# Package format
PACKAGE_CLASSES = "package_rpm"

VIRTUAL-RUNTIME_init_manager = "systemd"
PREFERRED_PROVIDER_virtual/psplash = "plymouth"

DISTRO_FEATURES:append = " systemd"
DISTRO_FEATURES:append = " webengine cups dbus pulseaudio opengl usrmerge plymouth"
DISTRO_FEATURES:remove = "x11 wayland vulkan bluetooth nfs ppp zeroconf wifi"

PACKAGECONFIG:append:pn-qtbase = " kms gbm tslib kms gbm zstd libproxy gssapi mtdev cups sql-sqlite journald"
PACKAGECONFIG:append:pn-qtwebengine = " printing-and-pdf glib lcms2 libevent libjpeg libpci libpng libwebp opus snappy spellchecker webchannel webrtc zlib"